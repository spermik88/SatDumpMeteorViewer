name: Android debug build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources and Android dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"
          # VOLK generates kernels from Mako templates during the dependency build.
          sudo apt-get update
          sudo apt-get install -y python3-mako

      - name: Build native Android dependencies
        working-directory: android/deps
        run: |
          # The app's abiFilters only package ARM binaries, so test those exact
          # targets instead of spending runner time on unsupported emulator ABIs.
          sed -i -E '/^build_[a-z0-9_]+ (x86|x86_64)$/d' build.sh
          # Match the CMake version used later by Gradle.  The runner's system
          # CMake is newer and is not compatible with this NDK 25 dependency build.
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          cmake --version
          set +e
          # build.sh itself does not enable errexit; use it here so a failed
          # package cannot be masked by a later successful command.
          bash -e build.sh > deps-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            # GitHub stores at most 4096 characters per annotation; keep the
            # end of the log where the compiler or make error is emitted.
            excerpt="$(tail -n 100 deps-build.log | tail -c 3500)"
            excerpt="$(printf '%s' "$excerpt" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Android dependency build failed::$excerpt"
            {
              echo '### Android dependency build failure'
              echo '```text'
              tail -n 200 deps-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Assemble debug APK
        working-directory: android
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            # The useful Gradle error comes before the stack trace.  Keep that
            # section in the annotation so a public run is diagnosable without
            # downloading its protected raw log archive.
            excerpt="$(sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log | tail -c 3500)"
            if [ -z "$excerpt" ]; then
              excerpt="$(grep -n -E '(^|[[:space:]])(FAILURE:|Execution failed|Caused by|error:)' gradle-build.log | head -n 80)"
            fi
            excerpt="$(printf '%s' "$excerpt" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Gradle assembleDebug failed::$excerpt"
            {
              echo '### Gradle assembleDebug failure'
              echo '```text'
              sed -n '/^\* What went wrong:/,/^\* Try:/p' gradle-build.log
              echo
              echo '--- final 160 log lines ---'
              tail -n 160 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDumpMeteorViewer-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
