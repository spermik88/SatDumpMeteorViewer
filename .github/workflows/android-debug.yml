name: Android debug build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out sources and Android dependencies
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;25.2.9519653"

      - name: Build native Android dependencies
        working-directory: android/deps
        run: |
          # The app's abiFilters only package ARM binaries, so test those exact
          # targets instead of spending runner time on unsupported emulator ABIs.
          sed -i -E '/^build_[a-z0-9_]+ (x86|x86_64)$/d' build.sh
          bash build.sh

      - name: Assemble debug APK
        working-directory: android
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace > gradle-build.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            excerpt="$(tail -n 80 gradle-build.log | tr '\n' ' ' | sed 's/  */ /g')"
            echo "::error title=Gradle assembleDebug failed::$excerpt"
            {
              echo '### Gradle assembleDebug failure'
              echo '```text'
              tail -n 160 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDumpMeteorViewer-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
